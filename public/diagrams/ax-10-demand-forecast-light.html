<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>uture — 수요 예측 · 재고 최적화 (light / aurora)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     uture-motion-diagrams / LIGHT theme — AURORA (CHART form)
     Scene: 과거 판매 데이터(source capsule) → AI 예측 모델
            (aurora badge = single emphasis) → 미래 수요 곡선
            chart card (hairline history → vivid-orange --pulse
            forecast line + very faint aurora prediction band)
            → 재고 최적화 결과 칩 2개 (재고 비용 절감 / 품절률 감소).
     Chart styling DERIVED from invariants (no example chart exists):
       - axes + history line = hairlines (1.25px, --hair/--ink-soft)
       - forecast line = the ONE emphasis in orange (--pulse)
       - prediction band = aurora at VERY low opacity (blurred fill)
       - result chips = white capsules; deltas as bare-ish mono in
         outlined mini-pills; negative space ~60% occupancy.
     Master loop 8.5s (chart draw + band + 2 result chips + delta
     count → don't squeeze, hold ≥1.2s wins). All animations share
     the 8.5s duration with percentage windows → seamless loop.
     ============================================================ */
  :root {
    --bg: #EDECEA;              /* warm light gray, NOT white */
    --card: #FFFFFF;
    --ink: #1A1A1A;
    --ink-soft: #6B6864;        /* muted label ink */
    --hair: #DCDAD6;            /* hairline on light */
    --wire: #C9C6C1;            /* connector strokes */
    --pulse: #FF8A3C;           /* vivid orange — forecast line / success ONLY */
    --shadow: 0 8px 28px rgba(0,0,0,.10);
    --stroke-w: 1.25px;
    --loop: 8.5s;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--ink);
    display: grid; place-items: center;
  }
  .canvas { position: relative; width: 1200px; height: 900px; }

  /* huge rounded page frame, inset (light-theme option) */
  .frame {
    position: absolute; inset: 26px; border-radius: 96px;
    border: var(--stroke-w) solid var(--hair);
    background: linear-gradient(180deg, #F3F2F0 0%, var(--bg) 60%);
  }

  /* ---------- aurora (the ONLY gradient) ---------- */
  .aurora {
    background: linear-gradient(105deg, #B79CF7 0%, #D9C2FC 25%, #F7BFD3 50%, #FFC89B 75%, #FF9857 100%);
    background-size: 200% 200%;
    animation: aurora-drift 8s ease-in-out infinite alternate;
  }
  @keyframes aurora-drift { from { background-position: 0% 40%; } to { background-position: 100% 60%; } }

  /* ---------- shape primitives ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 11px;
    background: var(--card); border: var(--stroke-w) solid var(--hair);
    border-radius: 999px; padding: 10px 20px 10px 12px;
    font-size: 14px; font-weight: 500; color: var(--ink);
    box-shadow: var(--shadow);
  }
  .chip {
    width: 32px; height: 32px; flex: none;
    border-radius: 11px; display: grid; place-items: center;
    background: #F4F3F1; border: var(--stroke-w) solid var(--hair);
  }
  .chip svg { width: 16px; height: 16px; stroke: var(--ink); fill: none;
              stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
          font-size: 11px; font-weight: 500; }
  .tag  { text-transform: uppercase; letter-spacing: .04em; font-size: 11px;
          font-weight: 600; color: var(--ink-soft); }

  /* ---------- layout ---------- */
  .abs { position: absolute; }
  #src-wrap   { top: 118px; left: 0; right: 0; display: flex; justify-content: center; }
  #ai-wrap    { top: 248px; left: 0; right: 0; display: flex; justify-content: center; }
  #wires      { top: 0; left: 0; width: 1200px; height: 900px; pointer-events: none; }
  #chart-wrap { top: 452px; left: 0; right: 0; display: flex; justify-content: center; }
  #chips-wrap { top: 802px; left: 0; right: 0; display: flex; justify-content: center; gap: 26px; }

  #src .mono { color: var(--ink-soft); }

  /* AI badge — aurora fill = the single emphasis (filled vs outlined) */
  #ai-glow {
    position: absolute; left: 50%; top: 248px; transform: translate(-50%, -12px);
    width: 372px; height: 116px; border-radius: 999px; filter: blur(22px);
    opacity: .5; z-index: 0;
  }
  #ai {
    position: relative; z-index: 1;
    padding: 13px 26px 13px 13px; gap: 13px; border: none;
    color: var(--ink); box-shadow: 0 10px 32px rgba(255,158,94,.28);
  }
  #ai .chip { background: rgba(255,255,255,.55); border-color: rgba(255,255,255,.7); }
  #ai .chip svg { stroke: var(--ink); }
  #ai .name { font-size: 16px; font-weight: 600; letter-spacing: .01em; }
  #ai .role { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
              color: rgba(26,26,26,.62); }

  /* ---------- chart card (white + soft shadow) ---------- */
  #chart {
    width: 640px; background: var(--card); border-radius: 28px;
    border: var(--stroke-w) solid var(--hair); box-shadow: var(--shadow);
    padding: 22px 26px 20px; display: flex; flex-direction: column; gap: 14px;
  }
  #chart .head { display: flex; align-items: center; justify-content: space-between; }
  #chart .head .ttl { display: flex; align-items: center; gap: 10px; }
  #chart .head .ic {
    width: 30px; height: 30px; border-radius: 10px; flex: none;
    background: #F4F3F1; border: var(--stroke-w) solid var(--hair);
    display: grid; place-items: center;
  }
  #chart .head .ic svg { width: 15px; height: 15px; stroke: var(--ink); fill: none;
                         stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #chart .head .title { font-size: 14px; font-weight: 600; }
  /* legend: outlined mini-pills */
  .legend { display: flex; gap: 8px; }
  .legend .lp {
    display: inline-flex; align-items: center; gap: 7px;
    border: var(--stroke-w) solid var(--hair); border-radius: 999px;
    padding: 4px 11px 4px 9px; font-size: 11px; font-weight: 500; color: var(--ink-soft);
  }
  .legend .sw { width: 16px; height: 0; border-top: 1.5px solid var(--wire); border-radius: 2px; }
  .legend .sw.dash { border-top-style: dashed; }
  .legend .sw.fc { border-top: 2px solid var(--pulse); }

  .plot { position: relative; width: 588px; height: 236px; }

  /* result chips (white capsules; delta = mono in outlined mini-pill) */
  .chip-card {
    display: inline-flex; align-items: center; gap: 13px;
    background: var(--card); border: var(--stroke-w) solid var(--hair);
    border-radius: 999px; padding: 12px 20px 12px 13px; box-shadow: var(--shadow);
  }
  .chip-card .ic {
    width: 34px; height: 34px; border-radius: 11px; flex: none;
    background: #F4F3F1; border: var(--stroke-w) solid var(--hair);
    display: grid; place-items: center;
  }
  .chip-card .ic svg { width: 17px; height: 17px; stroke: var(--ink); fill: none;
                       stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .chip-card .txt { display: flex; flex-direction: column; gap: 3px; }
  .chip-card .lbl { font-size: 13px; font-weight: 500; color: var(--ink); }
  .chip-card .sub { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); }
  .chip-card .delta {
    display: inline-flex; align-items: center; gap: 5px;
    border: var(--stroke-w) solid var(--pulse); border-radius: 999px;
    padding: 4px 11px; color: var(--pulse);
  }
  .chip-card .delta .num { font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace;
                           font-size: 14px; font-weight: 500; }
  .chip-card .delta svg { width: 12px; height: 12px; stroke: var(--pulse); fill: none;
                          stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- master-loop windows (share --loop) ---------- */
  @keyframes enter-0  { 0%,2%  { opacity:0; transform:translateY(10px) scale(.97);} 7%  {opacity:1; transform:none;} 92% {opacity:1; transform:none;} 97%,100% {opacity:0;} }
  @keyframes enter-ai { 0%,12% { opacity:0; transform:translateY(10px) scale(.97);} 18% {opacity:1; transform:none;}
                        60% {transform:translateY(0);} 76% {transform:translateY(-4px);} 92% {opacity:1; transform:translateY(0);} 97%,100% {opacity:0;} }
  @keyframes glow-in  { 0%,12% { opacity:0;} 22% {opacity:.5;} 92% {opacity:.5;} 97%,100% {opacity:0;} }
  @keyframes enter-ch { 0%,30% { opacity:0; transform:translateY(10px) scale(.97);} 37% {opacity:1; transform:none;} 92% {opacity:1; transform:none;} 97%,100% {opacity:0;} }
  @keyframes enter-p1 { 0%,68% { opacity:0; transform:translateY(8px) scale(.97);} 74% {opacity:1; transform:none;} 92% {opacity:1; transform:none;} 97%,100% {opacity:0;} }
  @keyframes enter-p2 { 0%,71% { opacity:0; transform:translateY(8px) scale(.97);} 77% {opacity:1; transform:none;} 92% {opacity:1; transform:none;} 97%,100% {opacity:0;} }

  /* connector draw-in (pathLength=1) */
  @keyframes draw-1 { 0%,7%  { stroke-dashoffset:1; opacity:1;} 15% {stroke-dashoffset:0;} 92% {stroke-dashoffset:0; opacity:1;} 97%,100% {opacity:0;} }
  @keyframes draw-2 { 0%,20% { stroke-dashoffset:1; opacity:1;} 30% {stroke-dashoffset:0;} 92% {stroke-dashoffset:0; opacity:1;} 97%,100% {opacity:0;} }

  /* chart element windows (after chart card lands ~37%) */
  @keyframes axis-in  { 0%,38% { opacity:0;} 44% {opacity:1;} 92% {opacity:1;} 97%,100% {opacity:0;} }
  @keyframes hist-draw{ 0%,40% { stroke-dashoffset:1; opacity:1;} 52% {stroke-dashoffset:0;} 92% {stroke-dashoffset:0; opacity:1;} 97%,100% {opacity:0;} }
  @keyframes band-in  { 0%,52% { opacity:0;} 62% {opacity:1;} 92% {opacity:1;} 97%,100% {opacity:0;} }
  @keyframes fc-draw  { 0%,54% { stroke-dashoffset:1; opacity:1;} 66% {stroke-dashoffset:0;} 92% {stroke-dashoffset:0; opacity:1;} 97%,100% {opacity:0;} }
  @keyframes now-in   { 0%,50% { opacity:0;} 56% {opacity:1;} 92% {opacity:1;} 97%,100% {opacity:0;} }
  @keyframes dot-in   { 0%,64% { opacity:0; transform:scale(.4);} 70% {opacity:1; transform:scale(1);} 92% {opacity:1;} 97%,100% {opacity:0;} }

  .anim { animation-duration: var(--loop); animation-iteration-count: infinite;
          animation-timing-function: cubic-bezier(.22,1,.36,1); animation-fill-mode: both; }
  #src      { animation-name: enter-0; }
  #ai       { animation-name: enter-ai; }
  #ai-glow  { animation: glow-in var(--loop) ease-in-out infinite both; }
  #chart    { animation-name: enter-ch; }
  #wires path.w1 { stroke-dasharray: 1; animation: draw-1 var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #wires path.w2 { stroke-dasharray: 1; animation: draw-2 var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }

  #plot .axis    { animation: axis-in var(--loop) ease-in-out infinite both; }
  #plot .hist    { stroke-dasharray: 1; animation: hist-draw var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #plot .band    { animation: band-in var(--loop) ease-in-out infinite both; }
  #plot .fc      { stroke-dasharray: 1; animation: fc-draw var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #plot .nowline { animation: now-in var(--loop) ease-in-out infinite both; }
  #plot .nowlbl  { animation: now-in var(--loop) ease-in-out infinite both; }
  #plot .endpt   { animation: dot-in var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #chip-1  { animation-name: enter-p1; }
  #chip-2  { animation-name: enter-p2; }

  @media (prefers-reduced-motion: reduce) {
    .anim, #ai-glow, #wires path.w1, #wires path.w2,
    #plot .axis, #plot .hist, #plot .band, #plot .fc,
    #plot .nowline, #plot .nowlbl, #plot .endpt, .aurora { animation: none; }
    .anim { opacity: 1; transform: none; }
    #ai-glow { opacity: .5; }
    #wires path.w1, #wires path.w2, #plot .hist, #plot .fc { stroke-dashoffset: 0; }
    #plot .axis, #plot .band, #plot .nowline, #plot .nowlbl, #plot .endpt { opacity: 1; }
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="frame"></div>

  <!-- 1. source capsule: 과거 판매 데이터 -->
  <div id="src-wrap" class="abs">
    <div id="src" class="pill anim">
      <span class="chip">
        <svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 20v-6M12 20v-9M16 20v-4M20 20V8"/></svg>
      </span>
      과거 판매 데이터
      <span class="mono">24개월</span>
    </div>
  </div>

  <!-- aurora glow ring behind the AI badge -->
  <div id="ai-glow" class="aurora abs"></div>

  <!-- 2. AI 예측 모델 — aurora fill = single emphasis point -->
  <div id="ai-wrap" class="abs">
    <div id="ai" class="pill aurora anim">
      <span class="chip">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.7 5 5 1.7-5 1.7L12 17l-1.7-5-5-1.7 5-1.7L12 3z"/><path d="M19 4l.6 1.7L21 6l-1.4.3L19 8l-.6-1.7L17 6l1.4-.3L19 4z"/></svg>
      </span>
      <span style="display:flex; flex-direction:column; gap:2px;">
        <span class="name">AI 수요 예측 모델</span>
        <span class="role">Demand Forecasting</span>
      </span>
    </div>
  </div>

  <!-- connectors: source→AI, AI→chart -->
  <svg id="wires" class="abs" viewBox="0 0 1200 900" fill="none">
    <g stroke="var(--wire)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <path class="w1" pathLength="1" d="M600 184 V244"/>
      <path class="w2" pathLength="1" d="M600 320 V452"/>
    </g>
  </svg>

  <!-- 3. chart card: 미래 수요 곡선 -->
  <div id="chart-wrap" class="abs">
    <div id="chart" class="anim">
      <div class="head">
        <div class="ttl">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M4 15l5-4 4 3 7-8"/></svg></span>
          <span class="title">미래 수요 곡선 · 예측 구간</span>
        </div>
        <div class="legend">
          <span class="lp"><span class="sw"></span>과거 실적</span>
          <span class="lp"><span class="sw fc"></span>예측</span>
          <span class="lp"><span class="sw dash"></span>예측 밴드</span>
        </div>
      </div>

      <!-- plot: hairline axes + history + faint aurora band + orange forecast -->
      <svg id="plot" class="plot" viewBox="0 0 588 236" fill="none" preserveAspectRatio="none">
        <defs>
          <!-- very faint aurora fill for the prediction band -->
          <linearGradient id="bandg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"  stop-color="#B79CF7"/>
            <stop offset="55%" stop-color="#F7BFD3"/>
            <stop offset="100%" stop-color="#FF9857"/>
          </linearGradient>
        </defs>

        <!-- axes (hairlines) -->
        <g class="axis" stroke="var(--hair)" stroke-width="1.25" stroke-linecap="round">
          <line x1="10" y1="8" x2="10" y2="206"/>
          <line x1="10" y1="206" x2="580" y2="206"/>
          <!-- faint gridlines -->
          <g stroke="var(--hair)" stroke-width="1" opacity=".55" stroke-dasharray="2 6">
            <line x1="10" y1="60" x2="580" y2="60"/>
            <line x1="10" y1="112" x2="580" y2="112"/>
            <line x1="10" y1="164" x2="580" y2="164"/>
          </g>
        </g>

        <!-- prediction band (aurora, VERY faint) — right/forecast half only -->
        <path class="band" d="M330 96
                              C 372 82, 414 70, 456 60
                              C 498 50, 540 42, 578 36
                              L 578 96
                              C 540 88, 498 84, 456 82
                              C 414 80, 372 84, 330 96 Z"
              fill="url(#bandg)" opacity="0" style="opacity:1; fill-opacity:.14"/>

        <!-- history line (hairline, solid) -->
        <path class="hist" pathLength="1"
              d="M10 150 C 50 158, 78 138, 110 142
                 C 150 148, 178 120, 210 128
                 C 250 138, 278 108, 330 96"
              stroke="var(--ink-soft)" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>

        <!-- forecast line (vivid orange --pulse) = the ONE emphasis -->
        <path class="fc" pathLength="1"
              d="M330 96 C 372 84, 414 74, 456 66
                 C 498 58, 540 50, 578 44"
              stroke="var(--pulse)" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>

        <!-- "현재" divider between history and forecast -->
        <line class="nowline" x1="330" y1="16" x2="330" y2="206"
              stroke="var(--wire)" stroke-width="1.25" stroke-dasharray="3 5"/>

        <!-- forecast endpoint dot -->
        <circle class="endpt" cx="578" cy="44" r="4.5" fill="var(--pulse)"/>
      </svg>

      <!-- x-axis labels + now label (outside svg for crisp text) -->
      <div style="position:relative; height:0;">
        <span class="mono nowlbl" style="position:absolute; left:330px; top:-236px; transform:translateX(-50%); color:var(--ink-soft); background:var(--card); padding:0 6px;">현재</span>
        <span class="tag" style="position:absolute; left:22px; top:0; color:var(--ink-soft);">과거</span>
        <span class="tag" style="position:absolute; right:12px; top:0; color:var(--pulse);">예측 12주</span>
      </div>
    </div>
  </div>

  <!-- 4. result chips: 재고 최적화 결과 -->
  <div id="chips-wrap" class="abs">
    <div id="chip-1" class="chip-card anim">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span>
      <span class="txt">
        <span class="lbl">재고 비용 절감</span>
        <span class="sub">Inventory Cost</span>
      </span>
      <span class="delta">
        <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
        <span class="num">-31%</span>
      </span>
    </div>

    <div id="chip-2" class="chip-card anim">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M5 4h14v6a7 7 0 0 1-14 0V4z"/><path d="M9 20h6M12 17v3"/></svg></span>
      <span class="txt">
        <span class="lbl">품절률 감소</span>
        <span class="sub">Stockout Rate</span>
      </span>
      <span class="delta">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        <span class="num">-47%</span>
      </span>
    </div>
  </div>

</div>
</body>
</html>
