<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>사내 데이터 기반 챗봇 (RAG) — 아키텍처</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     uture-motion-diagrams / dark template (lavender accent)
     Scene: 사내 소스(문서·위키·DB) → 임베딩/벡터 인덱스
            → 검색(Retrieval) → LLM 답변(근거 문서 인용)
     Master loop: 9s. 4+ stages + answer fill → 9s so the ≥1.2s
     hold survives. All element animations share the 9s duration
     with %-based windows → seamless loop for screen recording.
     ============================================================ */
  :root {
    --bg: #262221;
    --accent: #E9D5FC;          /* lavender */
    --ink-on-accent: #262221;
    --stroke-w: 1.25px;
    --loop: 9s;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--accent);
    display: grid; place-items: center;
  }
  .canvas { position: relative; width: 1200px; height: 900px; }

  /* ---------- shape primitives ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 9px;
    border: var(--stroke-w) solid var(--accent); border-radius: 999px;
    padding: 8px 15px; font-size: 13px; font-weight: 500; white-space: nowrap;
  }
  .pill.filled { background: var(--accent); color: var(--ink-on-accent); border-color: var(--accent); }
  .chip {
    width: 28px; height: 28px; flex: none;
    border: var(--stroke-w) solid var(--accent); border-radius: 10px;
    display: grid; place-items: center;
  }
  .chip svg { width: 14px; height: 14px; stroke: var(--accent); fill: none;
              stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .card {
    border: var(--stroke-w) solid var(--accent); border-radius: 22px;
    padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;
    background: var(--bg);
  }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; font-size: 11px; }
  .tag  { text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }

  .stage-label { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .stage-label .idx { font-family: 'JetBrains Mono', ui-monospace, monospace;
                      font-size: 11px; opacity: .7; }
  .stage-label .txt { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }

  /* ---------- layout (absolute, centered horizontal pipeline) ----------
     WARNING: never center animated elements with transform:translateX(-50%) —
     enter keyframes animate transform and would override/drift it.
     Center columns with fixed left offsets instead. */
  .abs { position: absolute; }

  /* header */
  #title { top: 96px; left: 0; right: 0; text-align: center; }
  #title .h { font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  #title .s { margin-top: 8px; font-size: 12.5px; opacity: .68; letter-spacing: .01em; }

  /* STAGE 1 — 사내 소스 (stacked source pills) */
  #s1 { top: 300px; left: 96px; width: 210px; display: flex; flex-direction: column; gap: 14px; }
  #s1 .sources { display: flex; flex-direction: column; gap: 11px; }

  /* STAGE 2 — 임베딩 / 벡터 인덱스 (grid card) */
  #s2 { top: 300px; left: 372px; width: 220px; }
  #s2 .grid {
    position: relative; height: 118px; border-radius: 14px;
    border: var(--stroke-w) solid var(--accent);
    background-image:
      linear-gradient(to right, rgba(246,223,252,.14) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(246,223,252,.14) 1px, transparent 1px);
    background-size: 24px 24px; overflow: hidden;
  }
  #s2 .cell { position: absolute; width: 18px; height: 18px; border-radius: 5px;
              background: var(--accent); opacity: .82; }
  #s2 .cap { font-size: 11px; opacity: .68; text-align: center; }

  /* STAGE 3 — 검색 / Retrieval (search pills) */
  #s3 { top: 300px; left: 658px; width: 200px; display: flex; flex-direction: column; gap: 12px; }
  #s3 .hits { display: flex; flex-direction: column; gap: 10px; }
  #s3 .hit { justify-content: space-between; padding: 7px 13px; }
  #s3 .hit .score { font-family: 'JetBrains Mono', ui-monospace, monospace;
                    font-size: 10.5px; opacity: .72; }

  /* STAGE 4 — LLM 답변 (the one filled emphasis card) */
  #s4 { top: 292px; left: 922px; width: 232px; }
  #answer {
    border-radius: 22px; background: var(--accent); color: var(--ink-on-accent);
    padding: 18px 20px; display: flex; flex-direction: column; gap: 11px;
  }
  #answer .head { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13px; }
  #answer .head .chip { border-color: var(--ink-on-accent); }
  #answer .head .chip svg { stroke: var(--ink-on-accent); }
  #answer .line { height: 6px; border-radius: 3px; background: var(--ink-on-accent); opacity: .22; }
  #answer .cites { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 3px; }
  #answer .cite {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1.25px solid var(--ink-on-accent); border-radius: 999px;
    padding: 3px 9px; font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; color: var(--ink-on-accent);
  }
  #answer .cite .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--ink-on-accent); }
  #answer .cap { font-size: 10.5px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }

  /* user query (top-of-pipeline context) + the flow into retrieval */
  #query { top: 210px; left: 658px; width: 200px; }
  #query .pill { width: 100%; justify-content: center; padding: 8px 14px; }

  /* connectors */
  #wires { top: 0; left: 0; width: 1200px; height: 900px; pointer-events: none; }

  /* ---------- master-loop animation windows (9s) ----------
     narrative order: title → s1 sources → wire → s2 → wire → s3 hits
     ← query → wire → s4 answer → answer fill lines → cites.
     shared exit 92%→97%. */
  @keyframes t-in   { 0%,2%  {opacity:0; transform:translateY(10px);} 8% {opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }

  @keyframes en-a   { 0%,7%  {opacity:0; transform:translateY(10px) scale(.96);} 13%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }
  @keyframes en-b   { 0%,10% {opacity:0; transform:translateY(10px) scale(.96);} 16%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }
  @keyframes en-c   { 0%,13% {opacity:0; transform:translateY(10px) scale(.96);} 19%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }

  @keyframes en-s2  { 0%,25% {opacity:0; transform:translateY(10px) scale(.96);} 31%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }
  @keyframes cell-in{ 0%,29% {opacity:0; transform:scale(.6);} 35%{opacity:.82; transform:none;} 92%{opacity:.82;} 97%,100%{opacity:0;} }

  @keyframes en-q   { 0%,38% {opacity:0; transform:translateY(-8px);} 44%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }

  @keyframes en-h1  { 0%,45% {opacity:0; transform:translateY(10px) scale(.96);} 51%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }
  @keyframes en-h2  { 0%,47% {opacity:0; transform:translateY(10px) scale(.96);} 53%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }
  @keyframes en-h3  { 0%,49% {opacity:0; transform:translateY(10px) scale(.96);} 55%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }

  @keyframes en-ans { 0%,60% {opacity:0; transform:translateY(10px) scale(.96);} 66%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }
  @keyframes fill-l { 0%,66% {transform:scaleX(0);} 74%{transform:scaleX(1);} 92%{transform:scaleX(1);} 100%{transform:scaleX(1);} }
  @keyframes cite-in{ 0%,74% {opacity:0; transform:translateY(6px);} 80%{opacity:1; transform:none;} 92%{opacity:1;} 97%,100%{opacity:0;} }

  /* connector draw-in (pathLength=1) at staged windows */
  @keyframes draw12 { 0%,14% {stroke-dashoffset:1; opacity:1;} 24%{stroke-dashoffset:0;} 92%{stroke-dashoffset:0; opacity:1;} 97%,100%{opacity:0;} }
  @keyframes draw23 { 0%,33% {stroke-dashoffset:1; opacity:1;} 43%{stroke-dashoffset:0;} 92%{stroke-dashoffset:0; opacity:1;} 97%,100%{opacity:0;} }
  @keyframes draw34 { 0%,56% {stroke-dashoffset:1; opacity:1;} 64%{stroke-dashoffset:0;} 92%{stroke-dashoffset:0; opacity:1;} 97%,100%{opacity:0;} }
  /* dashed leader: cite → back to the index it came from */
  @keyframes leader { 0%,80% {opacity:0;} 85%{opacity:.85;} 92%{opacity:.85;} 97%,100%{opacity:0;} }

  .anim { animation-duration: var(--loop); animation-iteration-count: infinite;
          animation-timing-function: cubic-bezier(.22,1,.36,1); animation-fill-mode: both; }

  #title           { animation: t-in var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #src-a           { animation-name: en-a; }
  #src-b           { animation-name: en-b; }
  #src-c           { animation-name: en-c; }
  #s2              { animation-name: en-s2; }
  #s2 .cell        { animation: cell-in var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #query           { animation-name: en-q; }
  #hit-1           { animation-name: en-h1; }
  #hit-2           { animation-name: en-h2; }
  #hit-3           { animation-name: en-h3; }
  #s4              { animation-name: en-ans; }
  #answer .line    { transform-origin: left center; animation: fill-l var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #answer .cites   { animation: cite-in var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }

  #wires .w12 { stroke-dasharray:1; animation: draw12 var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #wires .w23 { stroke-dasharray:1; animation: draw23 var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #wires .w34 { stroke-dasharray:1; animation: draw34 var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #wires .leader { animation: leader var(--loop) linear infinite both; }

  /* stagger the cell entrances slightly for narrative feel */
  #s2 .cell:nth-child(1){ animation-delay: 0s; }
  #s2 .cell:nth-child(2){ animation-delay: .08s; }
  #s2 .cell:nth-child(3){ animation-delay: .16s; }
  #s2 .cell:nth-child(4){ animation-delay: .24s; }
  #s2 .cell:nth-child(5){ animation-delay: .32s; }
  #s2 .cell:nth-child(6){ animation-delay: .40s; }
  #answer .line:nth-of-type(1){ animation-delay: 0s; }
  #answer .line:nth-of-type(2){ animation-delay: .10s; }
  #answer .line:nth-of-type(3){ animation-delay: .20s; }

  @media (prefers-reduced-motion: reduce) {
    .anim, #title, #s2 .cell, #answer .line, #answer .cites,
    #wires .w12, #wires .w23, #wires .w34, #wires .leader {
      animation: none; opacity: 1; stroke-dashoffset: 0; transform: none;
    }
    #answer .line { transform: scaleX(1); }
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- header -->
  <div id="title" class="abs">
    <div class="h">사내 데이터 기반 챗봇 · RAG 아키텍처</div>
    <div class="s">사내 문서·위키·DB를 근거로 답하고, 인용 출처를 함께 표시</div>
  </div>

  <!-- STAGE 1 — 사내 소스 -->
  <div id="s1" class="abs">
    <div class="stage-label"><span class="idx">01</span><span class="txt">사내 소스</span></div>
    <div class="sources">
      <div id="src-a" class="pill anim">
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg></span>
        문서 · PDF
      </div>
      <div id="src-b" class="pill anim">
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 9h16M9 5v14"/></svg></span>
        사내 위키
      </div>
      <div id="src-c" class="pill anim">
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M12 5c4 0 7 1.2 7 2.8S16 10.6 12 10.6 5 9.4 5 7.8 8 5 12 5z"/><path d="M5 7.8v8.4C5 17.8 8 19 12 19s7-1.2 7-2.8V7.8"/></svg></span>
        업무 DB
      </div>
    </div>
  </div>

  <!-- STAGE 2 — 임베딩 / 벡터 인덱스 -->
  <div id="s2" class="abs anim">
    <div class="stage-label"><span class="idx">02</span><span class="txt">임베딩 · 벡터 인덱스</span></div>
    <div class="card" style="gap:11px; padding:14px 15px;">
      <div class="grid">
        <span class="cell" style="left:16px; top:14px;"></span>
        <span class="cell" style="left:64px; top:38px;"></span>
        <span class="cell" style="left:120px; top:20px;"></span>
        <span class="cell" style="left:40px; top:74px;"></span>
        <span class="cell" style="left:150px; top:64px;"></span>
        <span class="cell" style="left:96px; top:88px;"></span>
      </div>
      <div class="cap mono">embeddings → vector index</div>
    </div>
  </div>

  <!-- user query feeding retrieval -->
  <div id="query" class="abs anim">
    <div class="stage-label"><span class="idx">Q</span><span class="txt">사용자 질문</span></div>
    <span class="pill">"연차 이월 규정 알려줘"</span>
  </div>

  <!-- STAGE 3 — 검색 / Retrieval -->
  <div id="s3" class="abs">
    <div class="stage-label"><span class="idx">03</span><span class="txt">검색 · Retrieval</span></div>
    <div class="hits">
      <div id="hit-1" class="pill hit anim"><span>인사규정 §4.2</span><span class="score">0.94</span></div>
      <div id="hit-2" class="pill hit anim"><span>복무 가이드</span><span class="score">0.89</span></div>
      <div id="hit-3" class="pill hit anim"><span>FAQ · 연차</span><span class="score">0.81</span></div>
    </div>
  </div>

  <!-- STAGE 4 — LLM 답변 (filled emphasis) -->
  <div id="s4" class="abs anim">
    <div class="stage-label"><span class="idx">04</span><span class="txt">LLM 답변</span></div>
    <div id="answer">
      <div class="head">
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M12 3l1.7 4.8L18.5 9l-4.8 1.2L12 15l-1.7-4.8L5.5 9l4.8-1.2L12 3z"/></svg></span>
        생성된 답변
      </div>
      <div class="line" style="width:96%"></div>
      <div class="line" style="width:88%"></div>
      <div class="line" style="width:72%"></div>
      <div class="cap">근거 문서 인용</div>
      <div class="cites">
        <span class="cite"><span class="dot"></span>인사규정 §4.2</span>
        <span class="cite"><span class="dot"></span>복무 가이드</span>
      </div>
    </div>
  </div>

  <!-- connectors: 1→2, 2→3, 3→4 (rounded elbows); leader: cite → index -->
  <svg id="wires" class="abs" viewBox="0 0 1200 900" fill="none">
    <g stroke="var(--accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <path class="w12" pathLength="1" d="M306 360 H372"/>
      <path class="w23" pathLength="1" d="M592 360 H658"/>
      <path class="w34" pathLength="1" d="M858 360 H922"/>
      <!-- dashed leader: from an answer cite back up to the vector index -->
      <path class="leader" pathLength="1" d="M1010 500 V612 H482 Q470 612 470 600 V440" stroke-dasharray="3 5"/>
    </g>
  </svg>

</div>
</body>
</html>
