<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uture — 수요 예측 · 재고 최적화 (mobile / dark)</title>
<style>
  @font-face { font-family:'Pretendard Variable';
    src:url('/fonts/PretendardVariable.woff2') format('woff2-variations');
    font-weight:45 920; font-display:swap; }
  @font-face { font-family:'Geist Mono';
    src:url('/fonts/GeistMono-Variable-latin.woff2') format('woff2-variations');
    font-weight:100 900; font-display:swap; }

  :root { --bg:#262221; --accent:#E9D5FC; --ink-on:#262221;
          --soft:color-mix(in srgb, #E9D5FC 58%, transparent);
          --hair:color-mix(in srgb, #E9D5FC 55%, transparent);
          --faint:color-mix(in srgb, #E9D5FC 26%, transparent);
          --loop:9s; }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--accent); display:grid; place-items:center;
         font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo',system-ui,sans-serif; }
  .mono { font-family:'Geist Mono',ui-monospace,Menlo,monospace; }
  .canvas { width:390px; height:560px; display:flex; flex-direction:column; align-items:center;
            justify-content:center; padding:26px 18px; }
  .tag { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--soft);
         font-weight:500; font-family:'Geist Mono',ui-monospace,monospace; }
  h1 { font-size:19px; font-weight:700; letter-spacing:-.02em; margin-top:8px; margin-bottom:28px; }
  .flow { display:flex; flex-direction:column; align-items:center; width:100%; }
  .pillrow { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:344px; }
  .pill { border:1.25px solid var(--soft); border-radius:999px; padding:8px 15px; font-size:13px;
          font-weight:500; white-space:nowrap; }
  .pill.is-fill { background:var(--accent); border-color:var(--accent); color:var(--ink-on); font-weight:600; }
  .card { border:1.25px solid var(--accent); border-radius:14px; padding:11px 18px; text-align:center; }
  .card b { display:block; font-size:14px; font-weight:600; letter-spacing:-.01em; }
  .card span { display:block; font-size:10px; color:var(--soft); margin-top:3px;
               font-family:'Geist Mono',ui-monospace,Menlo,monospace; }
  .wire { width:1.5px; height:24px; background:var(--hair); transform-origin:top center; }
  /* 코어 비주얼 카드 */
  .viz { width:312px; border:1.25px solid var(--hair); border-radius:16px; padding:10px 12px 8px; }
  .viz .vlabel { font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--soft);
                 font-family:'Geist Mono',ui-monospace,monospace; margin-bottom:4px; display:block; }
  .viz svg { display:block; width:100%; }
  /* 등장 리듬 */
  .in   { animation:ain var(--loop) cubic-bezier(.22,1,.36,1) infinite both; animation-delay:var(--d,0s); }
  .draw { animation:adraw var(--loop) cubic-bezier(.22,1,.36,1) infinite both; animation-delay:var(--d,0s); }
  @keyframes ain   { 0%,1% {opacity:0; transform:translateY(8px);} 6% {opacity:1; transform:none;}
                     92% {opacity:1;} 98%,100% {opacity:0;} }
  @keyframes adraw { 0%,1% {transform:scaleY(0); opacity:1;} 6% {transform:scaleY(1);}
                     92% {transform:scaleY(1); opacity:1;} 98%,100% {opacity:0;} }
  /* 비주얼 내부 공용 윈도우 (마스터 루프 %) */
  .hit    { animation:vhit var(--loop) ease-in-out infinite both; }
  .hit2   { animation:vhit var(--loop) ease-in-out infinite both; animation-delay:.35s; }
  .hit3   { animation:vhit var(--loop) ease-in-out infinite both; animation-delay:.7s; }
  @keyframes vhit { 0%,34% {opacity:0;} 40% {opacity:1;} 92% {opacity:1;} 98%,100% {opacity:0;} }
  .edgedraw { stroke-dasharray:1; stroke-dashoffset:1;
              animation:vedge var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  @keyframes vedge { 0%,32% {stroke-dashoffset:1; opacity:0;} 36% {opacity:1;}
                     46% {stroke-dashoffset:0;} 92% {stroke-dashoffset:0; opacity:1;} 98%,100% {opacity:0;} }
  @media (prefers-reduced-motion: reduce) { .in,.draw,.hit,.hit2,.hit3,.edgedraw { animation:none; }
    .edgedraw { stroke-dashoffset:0; } }

</style></head>
<body><div class="canvas">
  <div class="tag">DEMAND FORECASTING</div>
  <h1>수요 예측 · 재고 최적화</h1>
  <div class="flow">
        <span class="pill in" style="--d:0.25s">과거 판매 데이터 · 24개월</span>
    <i class="wire draw" style="--d:0.70s"></i>
    <div class="viz in" style="--d:1.15s"><span class="vlabel">미래 수요 곡선 · 예측 구간</span><svg viewBox="0 0 300 126" fill="none">
      <g stroke="var(--faint)" stroke-width="1.25" stroke-linecap="round">
        <line x1="8" y1="6" x2="8" y2="108"/><line x1="8" y1="108" x2="292" y2="108"/>
        <g stroke-dasharray="2 6" opacity=".5"><line x1="8" y1="40" x2="292" y2="40"/><line x1="8" y1="74" x2="292" y2="74"/></g>
      </g>
      <path d="M162 50 C 190 44, 226 36, 288 26 L 288 52 C 240 47, 200 47, 162 50 Z" fill="var(--accent)" opacity=".1"/>
      <path d="M8 82 C 34 86, 54 72, 76 76 C 102 81, 120 62, 142 66 C 152 68, 158 56, 162 50"
            stroke="var(--soft)" stroke-width="1.5" stroke-linecap="round"/>
      <path pathLength="1" class="edgedraw" d="M162 50 C 190 42, 226 34, 288 26" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
      <circle class="hit3" cx="288" cy="26" r="4" fill="var(--accent)"/>
      <line x1="162" y1="12" x2="162" y2="108" stroke="var(--hair)" stroke-width="1" stroke-dasharray="3 5"/>
      <text x="162" y="9" fill="var(--soft)" font-size="8.5" text-anchor="middle" font-family="Geist Mono,monospace">NOW</text>
    </svg></div>
    <i class="wire draw" style="--d:1.60s"></i>
    <div class="pillrow"><span class="pill in" style="--d:2.05s">재고 비용 −31%</span><span class="pill in" style="--d:2.50s">품절률 −47%</span></div>
  </div>
</div></body></html>
