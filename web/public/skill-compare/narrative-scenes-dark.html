<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>uture · AI가 실무에 안착하지 못하는 이유 — dark scenes</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  /* 세 가지 pain: 같은 강의 반복 / 실무 단절 / 안 맞는 범용 툴.
     rose accent (pain 콘텐츠의 상황적 대안색). 강조(채움)는 단절의 ✕ 하나.
     Master loop 8s. */
  :root {
    --bg: #262221;
    --accent: #F9CFDA;
    --ink-on-accent: #262221;
    --stroke-w: 1.25px;
    --loop: 8s;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Geist', 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    color: var(--accent);
    display: grid; place-items: center;
  }
  .canvas { position: relative; width: 1600px; height: 900px; }
  #row { position: absolute; inset: 0; display: flex; gap: 30px; align-items: center; justify-content: center; }

  .panel {
    width: 380px; height: 330px;
    border: var(--stroke-w) solid var(--accent); border-radius: 26px;
    padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .panel header { display: flex; align-items: center; gap: 9px; }
  .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'Pretendard Variable', Pretendard, ui-monospace, monospace; font-size: 11px; opacity: .85; }
  .tag  { text-transform: uppercase; letter-spacing: .04em; font-size: 11px; font-weight: 500; }
  .stage { flex: 1; display: grid; place-items: center; }
  .caption { font-size: 13px; font-weight: 500; }

  .pillmini {
    display: inline-flex; align-items: center; gap: 8px;
    border: var(--stroke-w) solid var(--accent); border-radius: 999px;
    padding: 7px 14px; font-size: 12.5px; font-weight: 500; white-space: nowrap;
  }
  .col { display: flex; flex-direction: column; gap: 11px; align-items: center; }

  /* 단절: 파선 + 채워진 ✕ 칩 (전체 아티팩트의 유일한 강조) */
  .breakline { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .breakline svg { display: block; }
  .xchip {
    width: 28px; height: 28px; border-radius: 10px;
    background: var(--accent); display: grid; place-items: center; margin: 4px 0;
  }
  .xchip svg { width: 13px; height: 13px; stroke: var(--ink-on-accent); fill: none;
               stroke-width: 2; stroke-linecap: round; }

  /* 빈 슬롯: 파선 캡슐 */
  .slot {
    border: var(--stroke-w) dashed var(--accent); border-radius: 999px;
    padding: 7px 14px; font-size: 12.5px; opacity: .8;
  }

  /* ---------- 마스터 루프 ---------- */
  .anim { animation-duration: var(--loop); animation-iteration-count: infinite;
          animation-timing-function: cubic-bezier(.22,1,.36,1); animation-fill-mode: both; }
  @keyframes in-1 { 0%,2%  {opacity:0; transform:translateY(10px) scale(.96);} 9%  {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  @keyframes in-2 { 0%,5%  {opacity:0; transform:translateY(10px) scale(.96);} 12% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  @keyframes in-3 { 0%,8%  {opacity:0; transform:translateY(10px) scale(.96);} 15% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  #p1 { animation-name: in-1; } #p2 { animation-name: in-2; } #p3 { animation-name: in-3; }

  /* 패널 내부 요소들: 반복 행 스태거 */
  @keyframes rowin-a { 0%,16% {opacity:0; transform:translateY(8px);} 22% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  @keyframes rowin-b { 0%,20% {opacity:0; transform:translateY(8px);} 26% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  @keyframes rowin-c { 0%,24% {opacity:0; transform:translateY(8px);} 30% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  .r-a { animation: rowin-a var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  .r-b { animation: rowin-b var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  .r-c { animation: rowin-c var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }

  /* 단절선 드로우 + ✕ 팝 (내러티브의 핵심 순간) */
  @keyframes draw-break { 0%,34% {stroke-dashoffset:1; opacity:1;} 46% {stroke-dashoffset:0;} 91% {stroke-dashoffset:0; opacity:1;} 96%,100% {opacity:0;} }
  .breakline path { stroke-dasharray: 1; animation: draw-break var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  @keyframes xpop { 0%,46% {opacity:0; transform:scale(.7);} 52% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  .xchip { animation: xpop var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }

  /* 빈 슬롯: 마지막에 나타남 */
  @keyframes slotin { 0%,58% {opacity:0; transform:translateY(8px);} 64% {opacity:.8; transform:none;} 91% {opacity:.8;} 96%,100% {opacity:0;} }
  .slot { animation: slotin var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }

  @media (prefers-reduced-motion: reduce) {
    .anim, .r-a, .r-b, .r-c, .breakline path, .xchip, .slot { animation: none !important; opacity: 1; stroke-dashoffset: 0; }
    .slot { opacity: .8; }
  }
</style>
</head>
<body>
<div class="canvas">
  <div id="row">

    <!-- 01 같은 강의만 반복 -->
    <div id="p1" class="panel anim">
      <header><span class="mono">01</span><span class="tag">같은 강의</span></header>
      <div class="stage">
        <div class="col">
          <span class="pillmini r-a">전사 공통 강의 <span class="mono">1회차</span></span>
          <span class="pillmini r-b">전사 공통 강의 <span class="mono">2회차</span></span>
          <span class="pillmini r-c">전사 공통 강의 <span class="mono">3회차</span></span>
        </div>
      </div>
      <span class="caption">직무도 숙련도도 다른데, 모두 같은 강의</span>
    </div>

    <!-- 02 실무 단절 — 유일한 강조(채워진 ✕) -->
    <div id="p2" class="panel anim">
      <header><span class="mono">02</span><span class="tag">실무 단절</span></header>
      <div class="stage">
        <div class="breakline">
          <span class="pillmini r-a">강의 수료 노트</span>
          <svg width="2" height="26" viewBox="0 0 2 26" fill="none">
            <path pathLength="1" d="M1 0 V26" stroke="var(--accent)" stroke-width="1.25" stroke-dasharray="3 5"/>
          </svg>
          <span class="xchip"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
          <svg width="2" height="26" viewBox="0 0 2 26" fill="none">
            <path pathLength="1" d="M1 0 V26" stroke="var(--accent)" stroke-width="1.25" stroke-dasharray="3 5"/>
          </svg>
          <span class="pillmini r-b">월요일 아침, 내 실제 업무</span>
        </div>
      </div>
      <span class="caption">다음 날 업무로 이어지지 않는 학습</span>
    </div>

    <!-- 03 안 맞는 범용 툴 -->
    <div id="p3" class="panel anim">
      <header><span class="mono">03</span><span class="tag">안 맞는 툴</span></header>
      <div class="stage">
        <div class="col">
          <span class="pillmini r-a">범용 AI 툴</span>
          <div class="r-b" style="display:flex; gap:8px;">
            <span class="mono" style="border:var(--stroke-w) solid var(--accent); border-radius:999px; padding:4px 10px;">보안 정책</span>
            <span class="mono" style="border:var(--stroke-w) solid var(--accent); border-radius:999px; padding:4px 10px;">사내 데이터</span>
          </div>
          <span class="slot">우리 업무에 맞는 도구 — 아직 없음</span>
        </div>
      </div>
      <span class="caption">정책과 어긋나고, 맞는 도구는 없다</span>
    </div>

  </div>
</div>
</body>
</html>
