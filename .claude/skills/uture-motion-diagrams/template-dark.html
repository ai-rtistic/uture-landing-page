<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>uture motion diagram — dark template</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  /* ============================================================
     uture-motion-diagrams / dark template (lavender accent)
     Scene: AI prompt → video → 3 generated outputs
     Master loop: 7s. All element animations live on the same
     7s duration so the loop is seamless for screen recording.
     ============================================================ */
  :root {
    --bg: #262221;
    --accent: #E9D5FC;          /* brand mains: #E9D5FC (purple) | #FFD2A8 (orange); situational: #C9E6F6 ice-blue etc. */
    --ink-on-accent: #262221;
    --stroke-w: 1.25px;
    --loop: 7s;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Geist', 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    color: var(--accent);
    display: grid; place-items: center;
  }
  .canvas { position: relative; width: 1200px; height: 900px; }

  /* ---------- shape primitives ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    border: var(--stroke-w) solid var(--accent); border-radius: 999px;
    padding: 9px 18px; font-size: 14px; font-weight: 500;
  }
  .pill.filled { background: var(--accent); color: var(--ink-on-accent); border-color: var(--accent); }
  .chip {
    width: 30px; height: 30px; flex: none;
    border: var(--stroke-w) solid var(--accent); border-radius: 10px;
    display: grid; place-items: center;
  }
  .chip svg { width: 15px; height: 15px; stroke: var(--accent); fill: none;
              stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .card {
    border: var(--stroke-w) solid var(--accent); border-radius: 22px;
    padding: 20px 22px; display: flex; flex-direction: column; gap: 10px;
  }
  .card .line { height: 2px; border-radius: 2px; background: var(--accent); opacity: .85; }
  .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'Pretendard Variable', Pretendard, ui-monospace, monospace; font-size: 11px; }
  .tag  { text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }

  /* ---------- layout (absolute, centered scene) ----------
     WARNING: never center animated elements with transform:translateX(-50%) —
     the enter keyframes also animate transform and would override/drift it.
     Center with left:0; right:0; justify-content:center (or margin offsets). */
  .abs { position: absolute; }
  #prompt   { top: 150px; left: 0; right: 0; display: flex; gap: 10px; align-items: center; justify-content: center; }
  #video    { top: 250px; left: 50%; margin-left: -110px; width: 220px; height: 130px;
              border: var(--stroke-w) solid var(--accent); border-radius: 26px; display: grid; place-items: center; }
  #video svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.5;
               stroke-linecap: round; stroke-linejoin: round; }
  #wires    { top: 0; left: 0; width: 1200px; height: 900px; pointer-events: none; }
  #outputs  { top: 560px; left: 0; right: 0; display: flex; gap: 26px; justify-content: center; }
  #outputs .card { width: 250px; }
  #stamp    { top: 292px; left: 50%; margin-left: 150px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

  /* ---------- master-loop animation windows ----------
     enter window per element, shared exit at 91%→96%.   */
  @keyframes enter-0  { 0%,3%  { opacity:0; transform:translateY(10px) scale(.96);} 10% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  @keyframes enter-1  { 0%,8%  { opacity:0; transform:translateY(10px) scale(.96);} 15% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  @keyframes enter-2a { 0%,30% { opacity:0; transform:translateY(10px) scale(.96);} 37% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  @keyframes enter-2b { 0%,33% { opacity:0; transform:translateY(10px) scale(.96);} 40% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  @keyframes enter-2c { 0%,36% { opacity:0; transform:translateY(10px) scale(.96);} 43% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  @keyframes enter-3  { 0%,46% { opacity:0; transform:translateY(6px);}            52% {opacity:1; transform:none;} 91% {opacity:1;} 96%,100% {opacity:0;} }
  /* connector draw-in (pathLength=1) */
  @keyframes draw     { 0%,17% { stroke-dashoffset:1; opacity:1;} 30% {stroke-dashoffset:0;} 91% {stroke-dashoffset:0; opacity:1;} 96%,100% {opacity:0;} }
  /* dashed leader line for the timestamp tag */
  @keyframes fade-3   { 0%,46% { opacity:0; } 52% {opacity:.9;} 91% {opacity:.9;} 96%,100% {opacity:0;} }

  .anim { animation-duration: var(--loop); animation-iteration-count: infinite;
          animation-timing-function: cubic-bezier(.22,1,.36,1); animation-fill-mode: both; }
  #prompt        { animation-name: enter-0; }
  #video         { animation-name: enter-1; }
  #wires path.w  { stroke-dasharray: 1; animation: draw var(--loop) cubic-bezier(.22,1,.36,1) infinite both; }
  #wires path.leader { animation: fade-3 var(--loop) linear infinite both; }
  #out-a { animation-name: enter-2a; }
  #out-b { animation-name: enter-2b; }
  #out-c { animation-name: enter-2c; }
  #stamp { animation-name: enter-3; }

  @media (prefers-reduced-motion: reduce) {
    .anim, #wires path.w, #wires path.leader { animation: none; opacity: 1; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- 1. prompt: sparkle chip + filled pill -->
  <div id="prompt" class="abs anim">
    <span class="chip"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg></span>
    <span class="pill">Generate titles, headings and chapters</span>
  </div>

  <!-- 2. video node -->
  <div id="video" class="abs anim">
    <svg viewBox="0 0 24 24"><path d="M9 7l8 5-8 5V7z"/></svg>
  </div>

  <!-- connectors: prompt→video, video→3 outputs (elbow, rounded) -->
  <svg id="wires" class="abs" viewBox="0 0 1200 900" fill="none">
    <g stroke="var(--accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <path class="w" pathLength="1" d="M600 196 V250"/>
      <path class="w" pathLength="1" d="M600 380 V440 M600 440 H462 Q450 440 450 452 V560 M600 440 V560 M600 440 H738 Q750 440 750 452 V560"/>
      <!-- dashed leader for timestamp tag -->
      <path class="leader" pathLength="1" d="M710 315 H745" stroke-dasharray="3 5"/>
    </g>
  </svg>

  <!-- 3. timestamp tag -->
  <div id="stamp" class="abs anim">
    <span class="pill mono" style="padding:4px 10px; gap:6px;">
      <svg viewBox="0 0 24 24" width="11" height="11" style="stroke:var(--accent);fill:none;stroke-width:2"><path d="M9 6l9 6-9 6V6z"/></svg>
      1:03–1:45
    </span>
    <span class="pill tag" style="padding:4px 10px;">Chapter 02</span>
  </div>

  <!-- 4. output cards -->
  <div id="outputs" class="abs">
    <div id="out-a" class="card anim">
      <div class="line" style="width:78%"></div><div class="line" style="width:92%"></div>
      <div class="line" style="width:64%"></div><div class="line" style="width:84%"></div>
    </div>
    <div id="out-b" class="card anim">
      <div class="line" style="width:88%"></div><div class="line" style="width:70%"></div>
      <div class="line" style="width:94%"></div><div class="line" style="width:58%"></div>
    </div>
    <div id="out-c" class="card anim">
      <div class="line" style="width:66%"></div><div class="line" style="width:90%"></div>
      <div class="line" style="width:76%"></div><div class="line" style="width:86%"></div>
    </div>
  </div>

</div>
</body>
</html>
